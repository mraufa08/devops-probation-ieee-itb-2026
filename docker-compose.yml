version: '3.8'

services:
  # MongoDB Database Service
  db:
    image: mongo:7.0
    container_name: devops_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Node.js + Express Backend Service
  backend:
    build: ./backend
    container_name: devops_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db:27017/${MONGO_DB_NAME}?authSource=admin
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # Vite + React Frontend Service
  frontend:
    build: ./frontend
    container_name: devops_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    restart: on-failure

# Data Persistence Volume
volumes:
  mongo_data: